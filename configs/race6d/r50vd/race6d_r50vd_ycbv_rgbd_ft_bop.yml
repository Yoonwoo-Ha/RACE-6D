# Inference config for the released YCB-V RGB-D (stage 2) weights. The training config gives the same
# predictions (its eval_idx sets the output layer); this file turns off the auxiliary outputs, restores the
# activations the weights were trained with (the training config now uses GELU / SiLU) and sets the
# objects 19/20 offsets the released weights were trained with.
aligned_offsets: {19: [10.4796698, -5.41739619, -1.23077576], 20: [-8.82785585, -10.93032056, 0.09932552]}

RACE6DTransformer_DQE:
  activation: quick_gelu
  mlp_act: quick_gelu
  vis_enc: False

RACE6DPostProcessor:
  vis_enc: False

HybridEncoder:
  enc_act: quick_gelu
