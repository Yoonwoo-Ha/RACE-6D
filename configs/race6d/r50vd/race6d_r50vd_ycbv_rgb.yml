__include__: [
  '../../dataset/coco_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/race6d_r50vd_best.yml',
]

# Training recipe of the released YCB-V RGB checkpoint (trained 2025-11 with the legacy code; the
# released weights were then migrated to this code base, LQE removed): 50 queries, legacy activations,
# pose loss 20 (encoder 15), no geometric aug, MultiStep 121 epochs (LR x0.1 at 101) after a 2000-iter
# linear warmup, batch 32 over PBR + real.
# Objects 19/20 are trained in the aligned frame: run sub/process_models.py (PLY) and sub/process_scene_gt.py
# (scene_gt) before building the COCO annotations, and keep need_aligned False (True would shift the poses twice).
# (The 2025-11 run used need_aligned True on annotations that are no longer available.)
# The released checkpoint was taken at epoch 66. Use race6d_r50vd_ycbv_rgb_bop.yml for inference.
output_dir: ./output/race6d_r50vd_ycbv_rgb
coco_path: ~/Downloads/ycbv/
category_file: ./configs/race6d/include/ycbv2coco_category.yml
num_classes: 21
eval_spatial_size: [480, 640]

RACE6D:
  backbone: PResNet

PResNet:
  depth: 50
  variant: d
  freeze_at: -1
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  hidden_dim: 256
  depth_mult: 0.67
  enc_act: quick_gelu

RACE6DTransformer_DQE:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_points: [3, 6, 3]
  num_layers: 3
  vis_enc: True
  num_queries: 50
  # Inference/eval output layer (training always uses every layer). The leaderboard CSV of the released
  # checkpoint came from decoder layer 1; the last layer gives AR 0.768.
  eval_idx: 1
  dropout: 0.0
  activation: relu
  mlp_act: quick_gelu
  enc_mlp_act: relu
  dec_mlp_act: quick_gelu

RACE6DPostProcessor:
  num_top_queries: 50
  vis_enc: True
  remap_mscoco_category: False
  # Objects 19/20 are trained in the aligned frame (sub/process_models.py shifts their meshes by -P).
  # When cam_K is given (bop.py) the postprocessor returns their poses in the original BOP frame (t - R@P).
  aligned_offsets: {19: [10.4796698, -5.41739619, -1.23077576], 20: [-8.82785585, -10.93032056, 0.09932552]}

RACE6DCriterion_addr:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_keypoints: 1, loss_oks: 1, loss_cr: 0.1, loss_pose: 20}
  enc_weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_keypoints: 1, loss_oks: 1, loss_cr: 0.1, loss_pose: 15}
  # pose before keypoint: the keypoint loss reuses the symmetry index chosen by the pose loss (legacy order was keypoint, pose).
  losses: ['vfl', 'boxes', 'pose', 'keypoint']
  alpha: 0.75
  gamma_pos: 2.0
  gamma_neg: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

# ../include/optimizer.yml is not included: its FlatCosine lr_scheduler keys would be merged into MultiStepLR.
use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
clip_max_norm: 0.1

optimizer:
  type: AdamW
  params:
    - params: ^(?=.*(?:norm|bn)).*$
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 121

lr_scheduler:
  type: MultiStepLR
  milestones: [101]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000

train_dataloader:
  dataset:
    type: ConcatDataset
    datasets:
      - type: CocoDetection
        img_folder: ~/Downloads/ycbv/ycbv2coco_train_pbr_amodal/train2017/
        ann_file: ~/Downloads/ycbv/ycbv2coco_train_pbr_amodal/annotations/instances_train2017.json
        transforms:
          ops:
            - {type: RandomCoarseDropout}
            - {type: ColorJitter}
            - {type: RandomHSVAdjust}
            - {type: RandomSharpen}
            - {type: RandomMotionBlur}
            - {type: RandomGaussianBlur}
            - {type: RandomGaussianNoise}
            - {type: RandomAdditionalNoise}
            - {type: ConvertPILImage, dtype: 'float32', scale: True}
            - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
          policy:
            name: stop_epoch
            epoch: 121
            ops: [RandomCoarseDropout, ColorJitter, RandomHSVAdjust, RandomSharpen, RandomMotionBlur, RandomGaussianBlur, RandomGaussianNoise, RandomAdditionalNoise]
        return_masks: True
        return_full_masks: False
        remap_mscoco_category: True
        return_depth: False
        category_file: ./configs/race6d/include/ycbv2coco_category.yml
        coco_path: ~/Downloads/ycbv/
        need_aligned: False
      - type: CocoDetection
        img_folder: ~/Downloads/ycbv/ycbv2coco_train_real_amodal/train2017/
        ann_file: ~/Downloads/ycbv/ycbv2coco_train_real_amodal/annotations/instances_train2017.json
        transforms:
          ops:
            - {type: RandomCoarseDropout}
            - {type: ColorJitter}
            - {type: RandomHSVAdjust}
            - {type: RandomSharpen}
            - {type: RandomMotionBlur}
            - {type: RandomGaussianBlur}
            - {type: RandomGaussianNoise}
            - {type: RandomAdditionalNoise}
            - {type: ConvertPILImage, dtype: 'float32', scale: True}
            - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
          policy:
            name: stop_epoch
            epoch: 121
            ops: [RandomCoarseDropout, ColorJitter, RandomHSVAdjust, RandomSharpen, RandomMotionBlur, RandomGaussianBlur, RandomGaussianNoise, RandomAdditionalNoise]
        return_masks: True
        return_full_masks: False
        remap_mscoco_category: True
        return_depth: False
        category_file: ./configs/race6d/include/ycbv2coco_category.yml
        coco_path: ~/Downloads/ycbv/
        need_aligned: False
  collate_fn:
    scales: ~
  total_batch_size: 32

val_dataloader:
  dataset:
    img_folder: ~/Downloads/ycbv/ycbv2coco_test_eval_amodal/val2017/
    ann_file: ~/Downloads/ycbv/ycbv2coco_test_eval_amodal/annotations/instances_val2017.json
    transforms:
      ops:
        - {type: FilterSmallBoxLowVis, min_size: 5, min_visib: 0.1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
    return_masks: True
    return_full_masks: False
    remap_mscoco_category: True
    return_depth: False
    category_file: ./configs/race6d/include/ycbv2coco_category.yml
    coco_path: ~/Downloads/ycbv/
    need_aligned: False
  total_batch_size: 1
