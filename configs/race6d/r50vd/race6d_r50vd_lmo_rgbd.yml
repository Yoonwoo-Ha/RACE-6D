__include__: [
  '../../dataset/coco_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/race6d_r50vd_best.yml',
]

# LM-O RGB-D: the LM-O RGB recipe (race6d_r50vd_lmo_rgb.yml) with a 4-channel input (RGB + depth, clipped at
# 2000 mm and scaled to [0, 1]). PasteSurfaces stands large panels / boxes on the PBR floor (the real desk has large
# tall surfaces that LM PBR lacks); PBR depth is warped with the scene rotation and gets the LM-O DepthAugment preset.
output_dir: ./output/race6d_r50vd_lmo_rgbd
coco_path: ~/Downloads/lmo/
category_file: ./configs/race6d/include/lmo2coco_category.yml
num_classes: 8
# eval_spatial_size: [768, 1024]
eval_spatial_size: [480, 640]

RACE6D:
  backbone: PResNet_depth

PResNet_depth:
  depth: 50
  variant: d
  freeze_at: -1
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: False
  pretrained: True
  in_chans: 4  # RGB-D

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  hidden_dim: 256
  depth_mult: 0.67

RACE6DTransformer_DQE:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_points: [3, 6, 3]
  num_layers: 3
  vis_enc: True
  num_queries: 20
  eval_idx: -1
  r_min: 0.5
  r_max: 2.0

RACE6DPostProcessor:
  num_top_queries: 20
  vis_enc: True
  remap_mscoco_category: False

RACE6DCriterion_addr:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_keypoints: 1, loss_oks: 1, loss_cr: 0.1, loss_pose: 5}
  losses: ['vfl', 'boxes', 'pose', 'keypoint']
  alpha: 0.75
  gamma_pos: 1.0
  gamma_neg: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    - params: ^(?=.*(?:norm|bn)).*$
      weight_decay: 0.
    - params: ^(?=.*score_head).*$
      lr: 5.0e-05
    - params: ^(?=.*bbox_head).*$
      lr: 5.0e-05

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 100

lr_scheduler:
  type: FlatCosineAnnealingLR
  T_max: 90
  lr_gamma: 0.5
  warmup_iter: 1000
  flat_epochs: 50

train_dataloader:
  dataset:
    img_folder: ~/Downloads/lmo/lmo2coco_train_pbr_amodal/train2017/
    ann_file: ~/Downloads/lmo/lmo2coco_train_pbr_amodal/annotations/instances_train2017.json
    transforms:
      ops:
        - {type: PasteSurfaces, p: 0.5, background_dir: ~/Downloads/VOCdevkit/VOC2012/JPEGImages/}
        - {type: PoseAugmentation, per_instance: False, rotation_range: 20.0, zoom_range: [1.0, 1.0], p: 0.5, background_dir: ~/Downloads/VOCdevkit/VOC2012/JPEGImages/}
        - {type: FilterSmallBoxLowVis, min_size: 5, min_visib: 0.1}
        # Kinect-like holes on the PBR depth (configs/race6d/README.md, DepthAugment presets: LM-O)
        - {type: DepthAugment, fill_prob: 0.0, obj_hole_prob: 0.0, bg_hole_prob: 0.0, edge_hole_prob: 1.0, edge_far_side: True, edge_keep_frac: [0.186, 0.388], edge_width_median: 8.4, edge_ragged: 3.0, edge_ragged_sigma: 3.0, region_hole_prob: 1.0, region_frac: [0.01, 0.04], region_sigma: 5.0, region_object_bias: 0.5, border_hole_prob: 1.0, border_left: [3, 15], border_top: [3, 7], border_jitter: 4, border_smooth: 15}
        - {type: RandomCoarseDropout}
        - {type: ColorJitter}
        - {type: RandomHSVAdjust}
        - {type: RandomSharpen}
        - {type: RandomMotionBlur}
        - {type: RandomGaussianBlur}
        - {type: RandomGaussianNoise}
        - {type: RandomAdditionalNoise}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy: {name: default}
    return_masks: True
    return_full_masks: True
    remap_mscoco_category: True
    return_depth: True
    category_file: ./configs/race6d/include/lmo2coco_category.yml
    coco_path: ~/Downloads/lmo/
    need_aligned: False
  collate_fn:
    scales: ~
  total_batch_size: 16

val_dataloader:
  dataset:
    img_folder: ~/Downloads/lmo/lmo2coco_test_eval_amodal/val2017/
    ann_file: ~/Downloads/lmo/lmo2coco_test_eval_amodal/annotations/instances_val2017.json
    transforms:
      ops:
        - {type: FilterSmallBoxLowVis, min_size: 5, min_visib: 0.1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
    return_masks: True
    return_full_masks: False
    remap_mscoco_category: True
    return_depth: True
    category_file: ./configs/race6d/include/lmo2coco_category.yml
    coco_path: ~/Downloads/lmo/
    need_aligned: False
  total_batch_size: 1
